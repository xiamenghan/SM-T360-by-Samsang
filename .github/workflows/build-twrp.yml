name: Build TWRP for SM-T360 (rubenswifi)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout 设备树
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          echo "释放前："
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          echo "释放后："
          df -h /

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32z1-dev lib32ncurses-dev lib32readline-dev \
            libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python2 unzip
          # Ubuntu 22.04 没有 python-is-python2，手动建软链
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          python --version
          # repo 工具
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: 安装 JDK 8（Android 9 编译必需）
        run: |
          # Ubuntu 22.04 仓库无 openjdk-8，用 Adoptium (Eclipse Temurin)
          sudo apt-get install -y wget apt-transport-https
          wget -qO - https://packages.adoptium.net/artifactory/api/gpg/key/public | sudo apt-key add -
          echo "deb https://packages.adoptium.net/artifactory/deb $(awk -F= '/VERSION_CODENAME/{print $2}' /etc/os-release) main" | sudo tee /etc/apt/sources.list.d/adoptium.list
          sudo apt-get update
          sudo apt-get install -y temurin-8-jdk
          echo "JAVA_HOME=/usr/lib/jvm/temurin-8-jdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/temurin-8-jdk-amd64/bin" >> $GITHUB_PATH

      - name: 兼容 Android 9 预编译 clang（libtinfo5）
        run: |
          # Ubuntu 22.04 只有 libtinfo.so.6，AOSP Pie 的预编译 clang 5.0 需要 .so.5
          sudo add-apt-repository -y "deb http://archive.ubuntu.com/ubuntu focal main universe" || true
          sudo apt-get update -o Acquire::Retries=3 || true
          sudo apt-get install -y libtinfo5 || true
          if [ ! -e /lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            echo "libtinfo5 未装上，改用软链兜底"
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          fi
          ls -l /lib/x86_64-linux-gnu/libtinfo.so.5*
          sudo add-apt-repository -y --remove "deb http://archive.ubuntu.com/ubuntu focal main universe" || true
          sudo apt-get update -o Acquire::Retries=3 || true

      - name: 配置 git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

      - name: 编译 TWRP
        run: |
          chmod +x build-twrp.sh
          set -o pipefail
          bash build-twrp.sh 2>&1 | tee build.log

      - name: 上传 recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: twrp-recovery-rubenswifi
          path: out/target/product/rubenswifi/recovery.img
          if-no-files-found: error
          retention-days: 30

      - name: 失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
